# Green theme for the Streamlit UI (`streamlit run src/ui/app.py` from the repo root). packaging/launcher.py passes
# the same values as flags for the packaged app; keep the two in step. Red is left for checks that fail.
[theme]
base = "light"
primaryColor = "#15803D"
backgroundColor = "#F5FAF6"
secondaryBackgroundColor = "#E8F3EB"
textColor = "#1E293B"
font = "sans serif"

[client]
toolbarMode = "minimal"  # hide the Deploy menu

[browser]
gatherUsageStats = false
